<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://platform.twitter.com https://cdn.syndication.twimg.com;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: https://pbs.twimg.com https://abs.twimg.com https://ton.twimg.com;
  font-src 'self' data:;
  connect-src 'self' https://cdn.syndication.twimg.com https://syndication.twitter.com https://twitter.com https://x.com;
  frame-src https://platform.twitter.com https://syndication.twitter.com;
  object-src 'none';
  base-uri 'self';
  form-action 'self';
">
<title>けもケット ブース一覧</title>
<style>
  :root{
    --paper:#f2f0e6;
    --panel:#2b3a30;
    --panel-2:#3a4d3f;
    --ink:#22261f;
    --moss:#5c7a52;
    --moss-light:#8fae7c;
    --clay:#b5652f;
    --line:#c9c3ac;
    --card-bg:#fbfaf4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.5;
  }

  header.top{
    background:var(--panel);
    color:var(--paper);
    padding:22px 20px 18px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .top-inner{
    max-width:1180px;
    margin:0 auto;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px 20px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:12px;
  }
  .brand .mark{
    font-size:26px;
    font-weight:700;
    letter-spacing:.02em;
  }
  .brand .sub{
    font-size:12px;
    color:var(--moss-light);
    letter-spacing:.04em;
  }
  .search-box{
    display:flex;
    align-items:center;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    border-radius:6px;
    padding:6px 10px;
  }
  .search-box input{
    background:transparent;
    border:none;
    outline:none;
    color:var(--paper);
    font-size:13px;
    width:180px;
  }
  .search-box input::placeholder{color:#c7d2c1;}

  .lang-switch{
    display:flex;
    gap:4px;
  }
  .lang-switch button{
    appearance:none;
    border:1px solid rgba(255,255,255,.25);
    background:transparent;
    color:var(--paper);
    padding:5px 10px;
    border-radius:4px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.03em;
    cursor:pointer;
    transition:background .15s;
  }
  .lang-switch button:hover{background:rgba(255,255,255,.12);}
  .lang-switch button.active{
    background:var(--clay);
    border-color:var(--clay);
    color:#fff;
  }

  .help-btn{
    appearance:none;
    border:1px solid rgba(255,255,255,.25);
    background:transparent;
    color:var(--paper);
    padding:5px 12px;
    border-radius:4px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.03em;
    cursor:pointer;
    transition:background .15s;
  }
  .help-btn:hover{background:rgba(255,255,255,.12);}

  .help-body p{
    margin:0 0 12px;
    line-height:1.7;
  }
  .help-body p:last-child{margin-bottom:0;}
  .help-body a{color:inherit;}

  nav.rows{
    max-width:1180px;
    margin:0 auto;
    margin-top:16px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  nav.rows button{
    appearance:none;
    border:1px solid rgba(255,255,255,.25);
    background:transparent;
    color:var(--paper);
    width:36px;
    height:36px;
    border-radius:4px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s, transform .1s;
  }
  nav.rows button:hover{background:rgba(255,255,255,.12);}
  nav.rows button.active{
    background:var(--clay);
    border-color:var(--clay);
    color:#fff;
  }
  nav.rows button.empty{
    opacity:.35;
  }
  nav.rows button.memo-tab-btn{
    width:auto;
    padding:0 12px;
    margin-left:8px;
    font-size:13px;
    font-weight:600;
    border-color:rgba(255,255,255,.35);
  }
  nav.rows button.memo-tab-btn.active{
    background:#c9973b;
    border-color:#c9973b;
  }

  main{
    max-width:1180px;
    margin:0 auto;
    padding:26px 20px 80px;
  }

  .row-heading{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin-bottom:18px;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
  }
  .row-heading .big-letter{
    font-size:42px;
    font-weight:800;
    line-height:1;
    color:var(--clay);
  }
  .row-heading .count{
    font-size:13px;
    color:#5a5646;
  }
  .notes-toolbar{
    display:flex;
    gap:8px;
    margin-left:auto;
    flex-wrap:wrap;
  }
  .notes-toolbar button{
    appearance:none;
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--ink);
    padding:6px 12px;
    border-radius:4px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s;
  }
  .notes-toolbar button:hover{background:#efece0;}

  .notes-extra{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin:-8px 0 18px;
  }
  .visit-filter{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .visit-filter button{
    appearance:none;
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--ink);
    padding:5px 10px;
    border-radius:4px;
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .visit-filter button:hover{background:#efece0;}
  .visit-filter button.active{
    background:var(--panel);
    border-color:var(--panel);
    color:var(--paper);
  }
  .budget-total{
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 12px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(128px,1fr));
    gap:14px;
  }

  .booth{
    position:relative;
    z-index:1;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 8px 12px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s, transform .12s;
  }
  .booth:hover{
    border-color:var(--moss);
    transform:translateY(-2px);
  }
  .booth .id{
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:11px;
    color:#8a8368;
    letter-spacing:.03em;
    margin-bottom:6px;
  }
  .avatar-wrap{
    width:64px;
    height:64px;
    margin:0 auto 8px;
    border-radius:50%;
    overflow:hidden;
    background:var(--panel-2);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .avatar-wrap.avatar-link{
    outline-offset:2px;
    transition:outline .12s;
  }
  .avatar-wrap.avatar-link:hover{
    outline:2px solid var(--moss);
  }
  .avatar-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .avatar-wrap .fallback{
    color:var(--moss-light);
    font-size:20px;
    font-weight:700;
  }
  .circle-name{
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .rep-name{
    font-size:11px;
    color:#8a8368;
    margin-top:2px;
  }
  .no-tw-badge{
    position:absolute;
    top:6px;
    right:6px;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#d9a24b;
    display:none;
  }
  .booth.no-tw .no-tw-badge{display:block;}

  /* 메모가 달린 부스 표시 */
  .booth.has-note{
    border-color:#c9973b;
    box-shadow:0 0 0 1px #c9973b inset;
    background:#fbf3e2;
  }
  .memo-flag{
    position:absolute;
    top:6px;
    left:6px;
    font-size:12px;
    line-height:1;
    display:none;
  }
  .booth.has-note .memo-flag{display:block;}

  /* 방문 예정/완료 부스 표시 (메모 표시보다 우선 적용) */
  .booth.visit-planned{
    border-color:#c99a1f;
    box-shadow:0 0 0 1px #c99a1f inset;
    background:#fff6d1;
  }
  .booth.visit-visited{
    border-color:#3f7a33;
    box-shadow:0 0 0 1px #3f7a33 inset;
    background:#e3f3df;
  }

  /* 팝오버 안의 메모 입력 영역 */
  .memo-box{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid rgba(255,255,255,.18);
  }
  .memo-box label{
    display:block;
    font-size:11px;
    color:var(--moss-light);
    margin-bottom:4px;
  }
  .memo-box textarea{
    width:100%;
    min-height:52px;
    resize:vertical;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    border-radius:6px;
    color:var(--paper);
    font-size:12px;
    font-family:inherit;
    padding:6px 8px;
    box-sizing:border-box;
  }
  .memo-box .memo-actions{
    display:flex;
    gap:6px;
    margin-top:6px;
  }
  .memo-box button{
    font-size:11px;
    padding:4px 10px;
    border-radius:5px;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08);
    color:var(--paper);
    cursor:pointer;
  }
  .memo-box button.save{
    background:#c9973b;
    border-color:#c9973b;
    color:#241b06;
    font-weight:600;
  }
  .memo-box .memo-status{
    font-size:10.5px;
    color:var(--moss-light);
    margin-left:auto;
    align-self:center;
  }

  /* hover / focus popover */
  .popover{
    display:none;
    position:absolute;
    z-index:200;
    left:50%;
    bottom:calc(100% + 10px);
    transform:translateX(-50%);
    width:300px;
    max-width:calc(100vw - 20px);
    background:var(--panel);
    color:var(--paper);
    border-radius:10px;
    padding:14px;
    box-shadow:0 12px 30px rgba(0,0,0,.35);
    text-align:left;
  }
  .popover.below{
    bottom:auto;
    top:calc(100% + 10px);
  }
  .booth.show-pop{ z-index:200; }
  .booth.show-pop .popover{display:block;}
  .popover::before{
    content:"";
    position:absolute;
    bottom:-6px;
    left:var(--arrow-left, 50%);
    transform:translateX(-50%) rotate(45deg);
    width:12px;
    height:12px;
    background:var(--panel);
  }
  .popover.below::before{
    bottom:auto;
    top:-6px;
  }
  .pop-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .pop-head img{
    width:44px;
    height:44px;
    border-radius:50%;
    object-fit:cover;
    background:var(--panel-2);
  }
  .pop-head .names{font-size:13px;}
  .pop-head .c-name{font-weight:700;}
  .pop-head .r-name{color:var(--moss-light);font-size:11px;}
  .pop-links{
    display:flex;
    gap:8px;
    margin-top:10px;
    font-size:11px;
  }
  .pop-links a{
    color:var(--moss-light);
    text-decoration:none;
    border:1px solid rgba(255,255,255,.25);
    padding:4px 8px;
    border-radius:5px;
  }
  .pop-links a:hover{background:rgba(255,255,255,.1);}

  /* 방문 예정/완료 표시 버튼 */
  .visit-box{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .visit-box button{
    flex:1;
    font-size:11.5px;
    font-weight:600;
    padding:6px 8px;
    border-radius:6px;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08);
    color:var(--paper);
    cursor:pointer;
    transition:background .15s, border-color .15s, color .15s;
  }
  .visit-box button.planned.active{
    background:#e0b12c;
    border-color:#e0b12c;
    color:#241b06;
  }
  .visit-box button.visited.active{
    background:#4a8f3c;
    border-color:#4a8f3c;
    color:#eafce6;
  }

  /* 부스별 예산 입력 */
  .budget-box{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid rgba(255,255,255,.18);
  }
  .budget-box label{
    display:block;
    font-size:11px;
    color:var(--moss-light);
    margin-bottom:4px;
  }
  .budget-input-row{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    border-radius:6px;
    padding:2px 8px;
  }
  .budget-input-row .yen{
    font-size:12px;
    color:var(--moss-light);
  }
  .budget-input-row input{
    flex:1;
    min-width:0;
    background:transparent;
    border:none;
    outline:none;
    color:var(--paper);
    font-size:12px;
    font-family:inherit;
    padding:6px 0;
  }

  .tweet-slot{
    margin-top:2px;
    min-height:20px;
  }
  .tweet-slot .placeholder{
    font-size:11.5px;
    color:#c7d2c1;
    border:1px dashed rgba(255,255,255,.25);
    border-radius:6px;
    padding:8px;
    line-height:1.5;
  }
  .tweet-slot iframe{border-radius:6px;}

  .empty-state{
    padding:60px 0;
    text-align:center;
    color:#8a8368;
    font-size:14px;
  }

  /* 배치도(스키매틱 맵) */
  .map-grid{
    display:flex;
    gap:16px;
    overflow-x:auto;
    padding-bottom:16px;
  }
  .map-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    flex:0 0 auto;
  }
  .map-col .map-col-label{
    font-weight:800;
    font-size:13px;
    color:var(--clay);
    margin-bottom:6px;
    position:sticky;
    top:0;
  }
  .map-col .map-cells{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .map-cells-pair{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .map-pair-row{
    display:flex;
    gap:2px;
  }
  .map-aisle-gap{
    height:7px;
  }
  .map-cell{
    width:22px;
    height:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:8.5px;
    font-family:"SFMono-Regular",Consolas,monospace;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:3px;
    color:#8a8368;
    cursor:pointer;
    user-select:none;
  }
  .map-cell.blank{
    border-color:transparent;
    background:transparent;
    cursor:default;
  }
  .map-cell:hover{ border-color:var(--moss); }
  .map-cell.has-note{
    background:#c9973b;
    border-color:#c9973b;
    color:#241b06;
    font-weight:700;
  }
  .map-cell.visit-planned{
    background:#e0b12c;
    border-color:#e0b12c;
    color:#241b06;
    font-weight:700;
  }
  .map-cell.visit-visited{
    background:#4a8f3c;
    border-color:#4a8f3c;
    color:#eafce6;
    font-weight:700;
  }
  .map-legend{
    display:flex;
    align-items:center;
    gap:16px;
    font-size:12px;
    color:#5a5646;
    margin-bottom:14px;
  }
  .map-legend .swatch{
    display:inline-block;
    width:12px;
    height:12px;
    border-radius:3px;
    vertical-align:-1px;
    margin-right:5px;
  }
  .map-legend .swatch.normal{ background:var(--card-bg); border:1px solid var(--line); }
  .map-legend .swatch.note{ background:#c9973b; }

  /* 모달 */
  .modal-backdrop{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(20,20,16,.55);
    z-index:500;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background:var(--panel);
    color:var(--paper);
    border-radius:12px;
    padding:18px;
    width:340px;
    max-width:100%;
    max-height:85vh;
    overflow-y:auto;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
  }
  .modal .modal-close{
    float:right;
    background:none;
    border:none;
    color:var(--paper);
    font-size:18px;
    cursor:pointer;
    line-height:1;
  }

  footer{
    max-width:1180px;
    margin:0 auto;
    padding:0 20px 50px;
    font-size:11.5px;
    color:#8a8368;
  }

  @media (max-width:640px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));}
    .popover{width:250px;}
    .popover::before{left:var(--arrow-left, 24px); transform:translateX(-50%) rotate(45deg);}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="mark" id="brandMark">けもケット ブース一覧</div>
      <div class="sub" id="brandSub">サークル配置ビューア</div>
    </div>
    <div class="lang-switch" id="langSwitch">
      <button type="button" data-lang="ko">KO</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="jp">JP</button>
    </div>
    <button type="button" class="help-btn" id="helpBtn"></button>
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="サークル名 / 代表者名 / 配置番号 검색">
    </div>
  </div>
  <nav class="rows" id="rowNav"></nav>
</header>

<main>
  <div class="row-heading">
    <div class="big-letter" id="currentLetter">A</div>
    <div class="count" id="currentCount"></div>
    <div class="notes-toolbar" id="notesToolbar" style="display:none;">
      <button type="button" id="exportNotesBtn"></button>
      <button type="button" id="importNotesBtn"></button>
      <input type="file" id="importNotesInput" accept="application/json" style="display:none;">
    </div>
  </div>
  <div class="notes-extra" id="notesExtra" style="display:none;">
    <div class="visit-filter" id="visitFilter">
      <button type="button" data-filter="all"></button>
      <button type="button" data-filter="planned"></button>
      <button type="button" data-filter="visited"></button>
    </div>
    <div class="budget-total" id="budgetTotal"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="map-grid" id="mapGrid" style="display:none;"></div>
  <div class="empty-state" id="emptyState" style="display:none;">검색 결과가 없어요.</div>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalContent"></div>
</div>

<footer id="siteFooter"></footer>

<script>
/* ---------- 데이터 ----------
   twitter: X 핸들 (없으면 null)
   팝오버는 이 핸들만으로 X 공식 타임라인 위젯(createTimeline)을 1개만 불러와서

   { "A-01": "메모 내용", ... } 형태의 notes 객체를 JSON 파일로 저장/복원함.
------------------------------------------------- */
function exportNotes(){
  const ids = Object.keys(notes);
  if(!ids.length){
    alert(t("exportEmpty"));
    return;
  }
  const payload = {
    app: "kemoket-notes",
    exportedAt: new Date().toISOString(),
    notes,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const dateStr = new Date().toISOString().slice(0, 10);
  const a = document.createElement("a");
  a.href = url;
  a.download = `kemoket-notes-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importNotesFromFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const incoming = (parsed && typeof parsed === "object" && parsed.notes && typeof parsed.notes === "object")
        ? parsed.notes
        : parsed;
      if(!incoming || typeof incoming !== "object" || Array.isArray(incoming)){
        throw new Error("invalid format");
      }
      if(!confirm(t("importConfirm"))) return;
      let count = 0;
      Object.keys(incoming).forEach(id => {
        if(typeof incoming[id] === "string" && incoming[id].trim()){
          notes[id] = incoming[id].trim().slice(0, MAX_NOTE_LENGTH);
          count++;
        }
      });
      saveNotes();
      renderNav();
      renderGrid();
      alert(t("importSuccess", { n: count }));
    } catch {
      alert(t("importFail"));
    }
  };
  reader.readAsText(file);
}

/* ---------- 팝오버 위치 보정 ----------
   화면 폭이 애매해서 카드가 왼쪽/오른쪽 가장자리에 있을 때, 가운데 정렬된
   팝오버가 화면 밖으로 잘려나가지 않도록 뷰포트 안쪽으로 위치를 조정함.
   세로 공간이 부족하면 카드 위 대신 아래로 펼침.
------------------------------------------------- */
function positionPopover(card, pop){
  const margin = 10;
  pop.style.left = "";
  pop.style.transform = "";
  pop.style.removeProperty("--arrow-left");
  pop.classList.remove("below");

  // innerWidth/innerHeight can include scrollbar gutters that aren't actually
  // visible content area, so use clientWidth/clientHeight for the real bounds.
  const viewportWidth = document.documentElement.clientWidth;
  const viewportHeight = document.documentElement.clientHeight;

  const cardRect = card.getBoundingClientRect();
  const popWidth = pop.offsetWidth;
  const popHeight = pop.offsetHeight;
  const cardCenter = cardRect.left + cardRect.width / 2;

  if(cardRect.top < popHeight + margin * 2 && (viewportHeight - cardRect.bottom) > cardRect.top){
    pop.classList.add("below");
  }

  const desired = cardCenter - popWidth / 2;
  const minLeft = margin - cardRect.left;
  const maxLeft = viewportWidth - margin - popWidth - cardRect.left;
  const left = Math.max(minLeft, Math.min(desired - cardRect.left, maxLeft));

  pop.style.left = `${left}px`;
  pop.style.transform = "none";
  pop.style.setProperty("--arrow-left", `${cardCenter - cardRect.left - left}px`);
}

window.addEventListener("resize", () => {

      img.loading = "lazy";
      img.src = localAvatarUrl(booth.twitter);
      img.alt = booth.name;
      img.onerror = () => {
        // 로컬에 저장된 이미지 파일이 없으면 서클명 첫 글자로 대체
        avatarWrap.innerHTML = "";
        const fb = document.createElement("div");
        fb.className = "fallback";
        fb.textContent = (booth.name[0] || "?");
        avatarWrap.appendChild(fb);
      };
      avatarWrap.appendChild(img);
    } else {
      const fb = document.createElement("div");
      fb.className = "fallback";
      fb.textContent = (booth.name[0] || "?");
      avatarWrap.appendChild(fb);
    }
    card.appendChild(avatarWrap);

    const nameEl = document.createElement("div");
    nameEl.className = "circle-name";
    nameEl.textContent = booth.name;
    card.appendChild(nameEl);

    const repEl = document.createElement("div");
    repEl.className = "rep-name";
    repEl.textContent = booth.rep;
    card.appendChild(repEl);

    const { pop, slot } = makePopover(booth);
    card.appendChild(pop);

    let timelineLoaded = false;
    const open = () => {
      // 새 부스 팝오버를 열 때는 열려 있던 다른 팝오버를 먼저 닫음(동시에 하나만 열림).
      closeAllPopovers(card);
      card.classList.add("show-pop");
      positionPopover(card, pop);
      if(booth.twitter && !timelineLoaded){
        timelineLoaded = true;
        loadTimelineInto(slot, booth.twitter);
      }
    };
    // 스크롤로 화면을 벗어나 자동으로 닫힐 때는 작성 중인 메모 초안을 유지함(다시 열면 그대로 남아있음).
    const closeSoft = () => card.classList.remove("show-pop");
    // 사용자가 직접 닫을 때(카드 재클릭, 바깥 클릭)는 저장하지 않은 메모 초안을 버림.
    const close = () => {
      closeSoft();
      const textarea = pop.querySelector(".memo-box textarea");
      if(textarea) textarea.value = getNote(booth.id);
    };

    // 클릭(탭)으로 토글: PC/모바일 공통
    card.addEventListener("click", (e) => {
      e.stopPropagation();
      card.classList.contains("show-pop") ? close() : open();
    });

    grid.appendChild(card);
  });
}

// 열려 있는 모든 부스 팝오버를 닫음. exceptCard를 지정하면 해당 카드는 건너뜀
// (새 팝오버를 열기 직전에 다른 팝오버들만 닫을 때 사용).
function closeAllPopovers(exceptCard){
  document.querySelectorAll(".booth.show-pop").forEach(el => {
    if(el === exceptCard) return;
    el.classList.remove("show-pop");
    const textarea = el.querySelector(".memo-box textarea");
    if(textarea) textarea.value = getNote(el.dataset.boothId);
  });
}

document.addEventListener("click", () => {
  closeAllPopovers();
});

// 스크롤로 부스 카드가 화면 밖으로 벗어나면 팝오버를 자동으로 닫음(메모 초안은 유지).
let scrollCloseQueued = false;
window.addEventListener("scroll", () => {
  if(scrollCloseQueued) return;
  scrollCloseQueued = true;
  requestAnimationFrame(() => {
    scrollCloseQueued = false;
    const viewportHeight = document.documentElement.clientHeight;
    document.querySelectorAll(".booth.show-pop").forEach(card => {
      const rect = card.getBoundingClientRect();
      if(rect.bottom < 0 || rect.top > viewportHeight){
        card.classList.remove("show-pop");
      }
    });
  });
}, { passive: true });

document.getElementById("searchInput").addEventListener("input", (e) => {
  currentQuery = e.target.value.trim();
  renderGrid();
});

/* ---------- 배치도(스키매틱 맵) ----------
   실제 회장 전체도(첨부 이미지) 두 장을 기준으로 페이지를 나눔:
   - 배치도1 = 展示室A・B (C,B,S,R,Q,P,O,N,M열)
   - 배치도2 = 展示室C・D (L,K,J,I,H,G,F,E,D,A열)
   각 열은 사진처럼 "왼쪽은 큰 번호부터 내려오고 오른쪽은 1번부터 올라오는"
   두 줄 마주보기 구조 + 4개마다 통로 틈으로 표현함(정확한 픽셀 좌표는 아니고
   사진 속 형태를 본뜬 스키매틱임).
------------------------------------------------------------- */
const MAP_PAGE_1 = ["C","B","S","R","Q","P","O","N","M"];     // 展示室A・B
const MAP_PAGE_2 = ["L","K","J","I","H","G","F","E","D","A"]; // 展示室C・D

function buildPairedColumn(list){
  const n = list.length;
  const half = Math.ceil(n / 2);
  const rightAsc = list.slice(0, half);           // 1 ~ half (오름차순, 오른쪽 줄)
  const leftDesc = list.slice(half).reverse();     // n ~ half+1 (내림차순, 왼쪽 줄)
  const rowCount = Math.max(leftDesc.length, rightAsc.length);

  const wrap = document.createElement("div");
  wrap.className = "map-cells-pair";

  const makeCell = (booth) => {
    if(!booth){
      const blank = document.createElement("div");
      blank.className = "map-cell blank";
      return blank;
    }
    const num = booth.id.split("-")[1];
    const cell = document.createElement("div");
    const visitCls = getVisitStatus(booth.id) === "planned" ? " visit-planned"
      : getVisitStatus(booth.id) === "visited" ? " visit-visited" : "";
    cell.className = "map-cell" + (getNote(booth.id) ? " has-note" : "") + visitCls;
    cell.dataset.boothId = booth.id;
    cell.textContent = num;
    cell.title = `${booth.id} ${booth.name}`;
    cell.addEventListener("click", () => openBoothModal(booth.id));
    return cell;
  };

  for(let i = 0; i < rowCount; i++){
    if(i > 0 && i % 4 === 0){
      const gap = document.createElement("div");
      gap.className = "map-aisle-gap";
      wrap.appendChild(gap);
    }
    const rowEl = document.createElement("div");
    rowEl.className = "map-pair-row";
    rowEl.appendChild(makeCell(leftDesc[i]));
    rowEl.appendChild(makeCell(rightAsc[i]));
    wrap.appendChild(rowEl);
  }

  return wrap;
}

function renderMapView(page){
  const mapGrid = document.getElementById("mapGrid");
  mapGrid.innerHTML = "";

  const order = page === "MAP2" ? MAP_PAGE_2 : MAP_PAGE_1;

  order.forEach(r => {
    const list = byRow[r];
    if(!list || !list.length) return;

    const col = document.createElement("div");
    col.className = "map-col";

    const label = document.createElement("div");
    label.className = "map-col-label";
    label.textContent = r;
    col.appendChild(label);

    col.appendChild(buildPairedColumn(list));
    mapGrid.appendChild(col);
  });

  if(!mapGrid.querySelector(".map-col")){
    mapGrid.innerHTML = `<div class="empty-state" style="display:block;">${escapeHtml(t("noBoothData"))}</div>`;
  }
}

/* ---------- 부스 상세 모달 (배치도에서 부스를 눌렀을 때) ---------- */
function openBoothModal(boothId){
  const booth = BOOTHS.find(b => b.id === boothId);
  if(!booth) return;

  const backdrop = document.getElementById("modalBackdrop");
  const content = document.getElementById("modalContent");
  content.innerHTML = "";

  const closeBtn = document.createElement("button");
  closeBtn.className = "modal-close";
  closeBtn.textContent = "✕";
  closeBtn.addEventListener("click", closeModal);
  content.appendChild(closeBtn);

  const head = document.createElement("div");
  head.className = "pop-head";
  head.style.marginTop = "6px";
  const img = document.createElement("img");
  if(booth.twitter){
    img.src = localAvatarUrl(booth.twitter);
    img.onerror = () => { img.style.visibility = "hidden"; };
  } else {
    img.style.visibility = "hidden";
  }
  const names = document.createElement("div");
  names.className = "names";
  names.innerHTML = `<div class="c-name">${escapeHtml(booth.name)}</div><div class="r-name">${escapeHtml(booth.rep)} ・ ${booth.id}</div>`;
  head.appendChild(img);
  head.appendChild(names);
  content.appendChild(head);

  const slot = document.createElement("div");
  slot.className = "tweet-slot";
  const ph = document.createElement("div");
  ph.className = "placeholder";
  ph.textContent = booth.twitter ? t("tweetLoadHint") : t("noTwitterHint");
  slot.appendChild(ph);
  content.appendChild(slot);
  if(booth.twitter){
    loadTimelineInto(slot, booth.twitter);
  }

  const links = document.createElement("div");
  links.className = "pop-links";
  if(booth.twitter){
    links.innerHTML = `<a href="https://x.com/${booth.twitter}" target="_blank" rel="noopener">${escapeHtml(t("openProfile"))}</a>`;
  }
  content.appendChild(links);

  const visitBox = document.createElement("div");
  visitBox.className = "visit-box";
  visitBox.innerHTML = `
    <button type="button" class="visit-btn planned">${escapeHtml(t("visitPlanned"))}</button>
    <button type="button" class="visit-btn visited">${escapeHtml(t("visitVisited"))}</button>
  `;
  const plannedBtn = visitBox.querySelector(".planned");
  const visitedBtn = visitBox.querySelector(".visited");
  const syncVisitButtons = () => {
    const status = getVisitStatus(booth.id);
    plannedBtn.classList.toggle("active", status === "planned");
    visitedBtn.classList.toggle("active", status === "visited");
  };
  syncVisitButtons();
  const refreshVisitViews = () => {
    updateVisitVisuals(booth.id);
    if(currentRow === "MAP1" || currentRow === "MAP2") renderMapView(currentRow);
  };
  plannedBtn.addEventListener("click", () => {
    setVisitStatus(booth.id, getVisitStatus(booth.id) === "planned" ? null : "planned");
    refreshVisitViews();
    syncVisitButtons();
  });
  visitedBtn.addEventListener("click", () => {
    setVisitStatus(booth.id, getVisitStatus(booth.id) === "visited" ? null : "visited");
    refreshVisitViews();
    syncVisitButtons();
  });
  content.appendChild(visitBox);

  const budgetBox = document.createElement("div");
  budgetBox.className = "budget-box";
  budgetBox.innerHTML = `
    <label>${escapeHtml(t("budgetLabel"))}</label>
    <div class="budget-input-row">
      <span class="yen">¥</span>
      <input type="number" min="0" step="100" inputmode="numeric" value="${getBudget(booth.id) || ""}" placeholder="0">
    </div>
  `;
  const budgetInput = budgetBox.querySelector("input");
  budgetInput.addEventListener("input", () => {
    setBudget(booth.id, budgetInput.value);
    updateBudgetTotalDisplay();
  });
  content.appendChild(budgetBox);

  const memoBox = document.createElement("div");
  memoBox.className = "memo-box";
  memoBox.innerHTML = `
    <label>${escapeHtml(t("memoLabel"))}</label>
    <textarea maxlength="1000" placeholder="${escapeHtml(t("memoPlaceholder"))}">${escapeHtml(getNote(booth.id))}</textarea>
    <div class="memo-actions">
      <button type="button" class="save">${escapeHtml(t("save"))}</button>
      <button type="button" class="delete">${escapeHtml(t("delete"))}</button>
      <span class="memo-status"></span>
    </div>
  `;
  const textarea = memoBox.querySelector("textarea");
  const saveBtn = memoBox.querySelector(".save");
  const deleteBtn = memoBox.querySelector(".delete");
  const status = memoBox.querySelector(".memo-status");

  saveBtn.addEventListener("click", () => {
    setNote(booth.id, textarea.value);
    updateNoteVisuals(booth.id);
    renderNav();
    if(currentRow === "MAP1" || currentRow === "MAP2") renderMapView(currentRow);
    if(currentRow === "NOTES") renderGrid();
    status.textContent = t("savedStatus");
    setTimeout(() => { status.textContent = ""; }, 1500);
  });
  deleteBtn.addEventListener("click", () => {
    textarea.value = "";
    setNote(booth.id, "");
    updateNoteVisuals(booth.id);
    renderNav();
    if(currentRow === "MAP1" || currentRow === "MAP2") renderMapView(currentRow);
    if(currentRow === "NOTES") renderGrid();
    status.textContent = t("deletedStatus");
    setTimeout(() => { status.textContent = ""; }, 1500);
  });

  content.appendChild(memoBox);

  backdrop.classList.add("open");
}

function openHelpModal(){
  const backdrop = document.getElementById("modalBackdrop");
  const content = document.getElementById("modalContent");
  content.innerHTML = "";

  const closeBtn = document.createElement("button");
  closeBtn.className = "modal-close";
  closeBtn.textContent = "✕";
  closeBtn.addEventListener("click", closeModal);
  content.appendChild(closeBtn);

  const title = document.createElement("h2");
  title.style.margin = "6px 0 14px";
  title.textContent = t("helpTitle");
  content.appendChild(title);

  const body = document.createElement("div");
  body.className = "help-body";
  const link = `<a href="https://skypalette.jp/kemoket/" target="_blank" rel="noopener">https://skypalette.jp/kemoket/</a>`;
  const paragraphs = (I18N[currentLang] && I18N[currentLang].helpBody) || I18N.ko.helpBody;
  body.innerHTML = paragraphs
    .map(line => `<p>${escapeHtml(line).replace("{link}", link)}</p>`)
    .join("");
  content.appendChild(body);

  backdrop.classList.add("open");
}

document.getElementById("helpBtn").addEventListener("click", openHelpModal);

  document.getElementById("importNotesInput").click();
});
document.getElementById("importNotesInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if(file) importNotesFromFile(file);
  e.target.value = "";
});

document.getElementById("visitFilter").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-filter]");
  if(!btn) return;
  notesVisitFilter = btn.dataset.filter;
  renderGrid();
});

function closeModal(){
  document.getElementById("modalBackdrop").classList.remove("open");
}

document.getElementById("modalBackdrop").addEventListener("click", (e) => {
  if(e.target.id === "modalBackdrop") closeModal();
});
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape") closeModal();
});

applyStaticTexts();
renderNav();
renderGrid();
</script>
